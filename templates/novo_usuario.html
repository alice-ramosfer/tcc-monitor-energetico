{% extends "base.html" %}
{% block title %}Novo Usuário — Monitor Energético{% endblock %}

{% block content %}
<div class="page-content">
  <div style="max-width:480px;margin:0 auto">

    <div style="background:var(--white);border:1px solid var(--border);border-radius:12px;padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06)">

      <h2 style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:24px;display:flex;align-items:center;gap:8px">
        <i class="bi bi-person-plus" style="color:var(--navy)"></i>
        Criar Novo Usuário
      </h2>

      <form method="POST">

        <div style="margin-bottom:16px">
          <label class="form-label">Nome completo</label>
          <input type="text" name="nome" class="form-control" placeholder="Alice Ramos" required>
        </div>

        <div style="margin-bottom:16px">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" placeholder="alice@gmail.com" required>
          
        </div>

        <div style="margin-bottom:16px">
          <label class="form-label">Senha</label>
          <input type="password" name="senha" class="form-control" placeholder="mínimo 6 caracteres" required minlength="6">
        </div>

        <div style="margin-bottom:28px">
          <label class="form-label">Perfil</label>
          <select name="perfil" class="form-select">
            <option value="viewer">Viewer — só visualiza</option>
            <option value="admin">Admin — acesso completo</option>
          </select>
        </div>

        <div style="display:flex;gap:10px">
          <button type="submit" class="btn-hist" style="width:auto;padding:10px 24px;border-radius:6px">
            Criar usuário
          </button>
          <a href="/" style="display:inline-flex;align-items:center;padding:10px 20px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:600;color:var(--gray);text-decoration:none;background:var(--white)">
            Cancelar
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
