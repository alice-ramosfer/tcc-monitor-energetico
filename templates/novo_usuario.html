{% extends "base.html" %}
{% block title %}Novo Usuário{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-bold">
        <i class="bi bi-person-plus me-2"></i>Criar Novo Usuário
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label small text-muted">Nome completo</label>
            <input type="text" name="nome" class="form-control form-control-dark" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">E-mail</label>
            <input type="email" name="email" class="form-control form-control-dark" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-muted">Senha</label>
            <input type="password" name="senha" class="form-control form-control-dark" required minlength="6">
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">Perfil</label>
            <select name="perfil" class="form-select form-control-dark">
              <option value="viewer">Viewer — só visualiza</option>
              <option value="admin">Admin — acesso completo</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-purple">Criar usuário</button>
            <a href="/" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
