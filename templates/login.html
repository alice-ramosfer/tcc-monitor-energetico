<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Monitor Energético</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="login-body">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-sm-10 col-md-6 col-lg-4">

      <div class="login-card">
        <!-- Logo -->
        <div class="text-center mb-4">
          <div class="login-icon">
            <i class="bi bi-lightning-charge-fill"></i>
          </div>
          <h4 class="fw-bold mt-3 mb-1">Monitor Energético</h4>
          <p class="text-muted small">Sistema de Monitoramento Escolar com ML</p>
        </div>

        <!-- Alertas -->
        {% with msgs = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in msgs %}
          <div class="alert alert-{{ cat }} py-2 small mb-3">{{ msg }}</div>
          {% endfor %}
        {% endwith %}

        <!-- Formulário -->
        <form method="POST" novalidate>
          <div class="mb-3">
            <label class="form-label small fw-500 text-muted">E-mail</label>
            <div class="input-group">
              <span class="input-group-text input-icon">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" name="email" class="form-control form-control-dark"
                     placeholder="admin@escola.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-500 text-muted">Senha</label>
            <div class="input-group">
              <span class="input-group-text input-icon">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" name="senha" id="senha"
                     class="form-control form-control-dark"
                     placeholder="••••••••" required>
              <button type="button" class="input-group-text input-icon"
                      onclick="toggleSenha()">
                <i class="bi bi-eye" id="eye-icon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-purple w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
          </button>
        </form>

        <!-- Info -->
        <div class="text-center mt-4 pt-3" style="border-top:1px solid #1e1e30">
          <small class="text-muted">
            UFJF · Engenharia Elétrica · 2026<br>
            <span style="color:#5b6af0">ESP32 + PZEM-004T + Python Flask + ML</span>
          </small>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
function toggleSenha() {
  const input = document.getElementById('senha');
  const icon  = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
